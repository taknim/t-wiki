<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    t-WiKi. 위키의 문서 잇기 표시([[…]])를 대괄호로 두고 그 안에 이름의 t 를 세웠습니다.
    32px 짜임이지만 16px 로 줄여도 대괄호와 t 가 붙지 않도록 간격을 벌려 두었습니다.
    바탕을 채운 것은 밝은 탭에서도 어두운 탭에서도 같은 모양으로 보이게 하기 위해서입니다.
  -->
  <rect width="32" height="32" rx="7" fill="#2f6feb"/>
  <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.7 8.6H7.7v14.8h3"/>
    <path d="M21.3 8.6h3v14.8h-3"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round">
    <path d="M16 9v9.4a2.2 2.2 0 0 0 2.2 2.2"/>
    <path d="M13.3 13.1h5.4"/>
  </g>
</svg>
